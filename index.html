<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vạn Quốc Corp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
/* Layout: một canvas 16:9 ở giữa, dưới là bảng phím tắt. Giao diện tối cố định, game là thế giới riêng. */
:root{
  --bg:#0b141c; --panel:#13212d; --line:#2c4256; --fg:#e8f0f6; --dim:#8fa6b8; --teal:#2ec4b6; --amber:#ffb703;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{padding-inline:16px;padding-block:16px 24px;min-height:100%}
main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0e1a24;border:2px solid var(--line);border-radius:6px;outline:none}
canvas:focus-visible{border-color:var(--teal)}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--dim);font-size:13px;line-height:1.5}
.keys span{min-width:0}
kbd{font-family:inherit;font-weight:600;font-size:12px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px}
</style>
</head>
<body>
<main>
  <canvas id="g" width="1920" height="1080" tabindex="0" aria-label="Trò chơi Vạn Quốc Corp"></canvas>
  <div class="keys">
    <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> hoặc <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> di chuyển / chọn</span>
    <span><kbd>Space</kbd> hành động (điểm danh, thức dậy)</span>
    <span><kbd>Enter</kbd> xác nhận</span>
    <span><kbd>Esc</kbd> bỏ qua</span>
    <span><kbd>P</kbd> tạm dừng</span>
    <span><kbd>N</kbd> bật/tắt nhạc nền</span>
    <span><kbd>M</kbd> bật/tắt toàn bộ âm thanh</span>
  </div>
</main>
<script>
(()=>{
'use strict';
const W=960,H=540;
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
ctx.scale(2,2);
cv.focus();

/* ---------- tiện ích ---------- */
const C={ink:'#0e1a24',wall:'#1d2c3b',floor:'#2a3b4d',floor2:'#304459',panel:'#13212d',line:'#3a5068',txt:'#e8f0f6',dim:'#8fa6b8',teal:'#2ec4b6',amber:'#ffb703',coral:'#ef476f',green:'#5bd67e',blue:'#4ea8de'};
const FONT='"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif';
const EMO='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'};
const fmt=m=>{m=Math.floor(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function text(s,x,y,size=16,col=C.txt,align='left',weight=600){ctx.font=weight+' '+size+'px '+FONT;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function emo(s,x,y,size=24){ctx.font=size+'px '+EMO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(s,x,y)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function bar(x,y,w,h,v,max,col){rr(x,y,w,h,h/2,'#0a121a');if(v>0)rr(x,y,Math.max(h,w*clamp(v/max,0,1)),h,h/2,col)}
function blink(t){return Math.sin(t*5)>-.2}

/* ---------- âm thanh ---------- */
let AC=null,muted=false;
function ensureAC(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function beep(f=520,d=.1,type='square',v=.05){if(muted)return;try{if(!ensureAC())return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
/* nhạc nền tự tạo bằng WebAudio, đổi phong cách theo từng cảnh */
const MOODS={
 bright:{bpm:100,tr:0,kick:[0,8],snare:[],hat:[4,12],bass:[0,6,8,14],arp:2,lead:.55,pad:.03,wave:'triangle'},
 pop:{bpm:112,tr:2,kick:[0,8],snare:[4,12],hat:[2,6,10,14],bass:[0,4,8,12],arp:2,lead:.5,pad:.025,wave:'triangle'},
 work:{bpm:126,tr:2,kick:[0,4,8,12],snare:[4,12],hat:[2,6,10,14],bass:[0,3,6,8,11,14],arp:2,lead:.3,pad:.02,wave:'square'},
 chill:{bpm:88,tr:-2,kick:[0,10],snare:[8],hat:[4,12],bass:[0,10],arp:4,lead:.45,pad:.035,wave:'sine'},
 dream:{bpm:62,tr:-4,kick:[],snare:[],hat:[],bass:[0],arp:8,lead:.25,pad:.05,wave:'sine'},
 warm:{bpm:80,tr:5,kick:[0],snare:[8],hat:[4,12],bass:[0,8],arp:4,lead:.4,pad:.04,wave:'triangle'},
};
const MOOD_OF={title:'bright',setup:'bright',brief:'bright',checkin:'pop',work1:'work',work2:'work',lunch:'chill',nap:'dream',tea:'pop',out:'warm'};
const MU={on:true,started:false,mood:MOODS.bright,step:0,next:0,li:2,master:null,noise:null,timer:null};
const CH=[[9,[0,3,7,10]],[5,[0,4,7,11]],[0,[0,4,7,11]],[7,[0,4,7,9]]];
const PENT=[0,2,4,7,9,12,14];
const hz=n=>130.81*Math.pow(2,n/12);
function tone(f,t,d,type,v,a=.01){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MU.master);o.start(t);o.stop(t+d+.05)}
function hit(t,d,v,hp){const s=AC.createBufferSource();s.buffer=MU.noise;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MU.master);s.start(t);s.stop(t+d+.02)}
function kickDrum(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(MU.master);o.start(t);o.stop(t+.2)}
function schedule(){
  const m=MU.mood,sd=60/m.bpm/4,st=MU.step%64,bar=Math.floor(st/16),k=st%16,t=MU.next;
  const ch=CH[bar],r=ch[0]+m.tr,iv=ch[1];
  if(k===0)iv.slice(0,3).forEach(i=>tone(hz(r+12+i),t,sd*15,'sine',m.pad,.25));
  if(m.bass.includes(k))tone(hz(r-12),t,sd*2.5,m.wave==='square'?'sawtooth':'triangle',.1,.01);
  if(k%m.arp===0){const i=iv[(k/m.arp)%iv.length];tone(hz(r+24+i),t,sd*m.arp*.9,m.wave,m.wave==='square'?.018:.03,.005)}
  if(m.kick.includes(k))kickDrum(t);
  if(m.snare.includes(k))hit(t,.1,.07,1500);
  if(m.hat.includes(k))hit(t,.04,.04,7000);
  if(k%2===0&&Math.random()<m.lead&&(bar%2===1||k%4===0)){
    MU.li=clamp(MU.li+pick([-2,-1,-1,0,1,1,2]),0,PENT.length-1);
    tone(hz(r+24+PENT[MU.li]),t,sd*pick([2,3,4]),m.wave==='square'?'triangle':'sine',.05,.02);
  }
}
MU.tick=()=>{if(!AC||!MU.started)return;while(MU.next<AC.currentTime+.2){schedule();MU.next+=60/MU.mood.bpm/4;MU.step++}};
MU.setMood=n=>{MU.mood=MOODS[MOOD_OF[n]]||MOODS.bright};
MU.apply=()=>{if(MU.master)MU.master.gain.setTargetAtTime(muted||!MU.on?0:.55,AC.currentTime,.05)};
MU.start=()=>{
  if(MU.started||!ensureAC())return;
  MU.master=AC.createGain();MU.master.connect(AC.destination);
  const buf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MU.noise=buf;
  MU.next=AC.currentTime+.1;MU.started=true;MU.apply();MU.timer=setInterval(MU.tick,30);
};
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});
const sfx={ok(){beep(660,.08);setTimeout(()=>beep(880,.1),70)},bad(){beep(160,.2,'sawtooth')},pick(){beep(740,.06)},step(){beep(440,.04)},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.07),i*110))}};

/* ---------- dữ liệu ---------- */
const NAT=[
 {id:'vn',name:'Việt Nam',perk:'Trà sữa tăng 50% tâm trạng',hair:'#1b1b1b',skin:1},
 {id:'jp',name:'Nhật Bản',perk:'Vùng điểm danh rộng hơn',hair:'#151515',skin:0},
 {id:'us',name:'Hoa Kỳ',perk:'Lương ngày +10%',hair:'#8b5a2b',skin:0},
 {id:'kr',name:'Hàn Quốc',perk:'Đi nhanh hơn 10%',hair:'#151515',skin:0},
 {id:'fr',name:'Pháp',perk:'Bữa trưa +4 tâm trạng',hair:'#5a3a1e',skin:0},
 {id:'br',name:'Brazil',perk:'Ngủ trưa hồi thêm 5 năng lượng',hair:'#2b1a10',skin:2},
 {id:'in',name:'Ấn Độ',perk:'Kinh nghiệm +5%',hair:'#111111',skin:2},
 {id:'de',name:'Đức',perk:'Thưởng nhiệm vụ +20%',hair:'#c9a24a',skin:0},
];
const AGES=[{a:22,t:'Trẻ khỏe: đi nhanh hơn 5%'},{a:30,t:'Cân bằng, không có điểm cộng'},{a:40,t:'Dày dạn: kinh nghiệm +10%'}];
const SKIN=['#f1c9a5','#e0a97a','#b9794d','#7a4a2e'];
const SHIRT=['#4ea8de','#ef476f','#2ec4b6','#ffb703','#9b7ede','#e8f0f6'];
const RANKS=[
 {n:'Thực tập sinh',xp:0,sal:20},{n:'Nhân viên',xp:120,sal:30},{n:'Chuyên viên',xp:320,sal:45},
 {n:'Trưởng nhóm',xp:650,sal:65},{n:'Trưởng phòng',xp:1100,sal:90},{n:'Giám đốc',xp:1750,sal:130},{n:'Tổng giám đốc',xp:2600,sal:200}
];
// [tên, emoji, giá, năng lượng, tâm trạng, lành mạnh]
const FOOD={
 vn:[['Phở bò','🍜',12,30,8,0],['Cơm tấm sườn','🍛',10,35,6,0],['Bánh mì','🥖',6,20,5,0],['Gỏi cuốn','🥗',8,18,4,1]],
 jp:[['Sushi','🍣',14,26,9,1],['Ramen','🍜',11,32,7,0],['Bento','🍱',12,30,6,1],['Udon','🍲',9,26,5,0]],
 us:[['Burger','🍔',10,34,7,0],['Pizza','🍕',9,30,8,0],['Salad gà','🥗',9,18,4,1],['Hot dog','🌭',6,22,5,0]],
 kr:[['Kimchi jjigae','🍲',11,30,7,0],['Bibimbap','🍚',12,32,8,1],['Tteokbokki','🌶️',8,24,8,0],['Gimbap','🍙',7,22,5,1]],
 fr:[['Croissant','🥐',6,18,7,0],['Ratatouille','🥘',12,26,6,1],['Sandwich','🥪',8,24,5,0],['Quiche','🥧',10,28,7,0]],
 br:[['Feijoada','🍲',12,36,7,0],['Churrasco','🥩',14,34,9,0],['Pão de queijo','🧀',6,18,6,0],['Açaí','🍇',8,20,6,1]],
 in:[['Cà ri gà','🍛',10,32,8,0],['Biryani','🍚',12,34,8,0],['Naan & dal','🫓',7,24,5,1],['Samosa','🥟',6,18,6,0]],
 de:[['Bratwurst','🌭',9,28,6,0],['Schnitzel','🍖',13,34,7,0],['Pretzel','🥨',5,16,5,0],['Salad khoai','🥗',8,20,4,1]],
};
const TEAS=[{n:'Trà sữa',c:'#c9a27a',p:7},{n:'Trà đào',c:'#ffb27a',p:7},{n:'Matcha latte',c:'#9ccc65',p:9},{n:'Trà vải',c:'#f4b6c2',p:8}];
const SUGAR=['0%','30%','50%','70%','100%'], ICE=['Không đá','Ít đá','Vừa đá','Nhiều đá'], TOP=['Trân châu','Thạch dừa','Pudding','Không topping'];
const ORDER=['checkin','work1','lunch','nap','work2','tea','out'];
const MPOOL=[
 {id:'docs',t:r=>'Giao '+(4+r*2)+' tài liệu',ok:(d,r)=>d.docs>=4+r*2},
 {id:'clean',t:()=>'Làm việc không va chạm',ok:d=>d.worked>0&&d.bumps===0},
 {id:'ci',t:()=>'Điểm danh Hoàn hảo',ok:d=>d.checkin==='perfect'},
 {id:'lunch',t:()=>'Ăn trưa lành mạnh',ok:d=>d.healthy},
 {id:'nap',t:()=>'Ngủ trưa đúng 15-25 phút',ok:d=>d.napPerfect},
 {id:'tea',t:()=>'Đặt trà sữa đúng 2 yêu cầu',ok:d=>d.tea>=2},
];

/* ---------- trạng thái ---------- */
let G=null,toasts=[],T=0,scene=null,sceneName='';
const natOf=()=>NAT.find(n=>n.id===G.p.nat);
const has=id=>G.p.nat===id;
function addXP(n){let m=1;if(has('in'))m+=.05;if(G.p.age>=40)m+=.1;const v=Math.round(n*m);G.xp+=v;G.dayXP+=v;return v}
function addScore(n){G.score+=Math.round(n);G.dayScore+=Math.round(n)}
function toast(s,col=C.amber){toasts.push({s,col,t:0})}
const stat=(k,d)=>{G[k]=clamp(G[k]+d,0,100)};
function newGame(p){G={p,day:1,xp:0,rank:0,score:0,money:40,energy:90,mood:70,streak:0,clock:480,pi:0,missions:[],ds:null,dayXP:0,dayScore:0,promoted:false};startDay()}
function startDay(){
  const others=MPOOL.filter(m=>m.id!=='docs').sort(()=>Math.random()-.5).slice(0,2);
  G.missions=[MPOOL[0],...others].map(m=>m.id);
  G.ds={docs:0,bumps:0,worked:0,checkin:null,healthy:false,napPerfect:false,tea:0,paid:false};
  G.dayXP=0;G.dayScore=0;G.pi=0;G.clock=480;
}
const missionObj=id=>MPOOL.find(m=>m.id===id);
const SAVE='vanquoc_save_v1';
function load(){try{const s=localStorage.getItem(SAVE);return s?JSON.parse(s):null}catch(e){return null}}
let SAVED=load();
/* lưu trữ đám mây: chỉ hoạt động khi mở qua link Claude (có capability db + user) */
const CLOUD={db:null,uid:null,ok:false,busy:false,pending:false,state:'local'};
const savePath=()=>'data/users/'+CLOUD.uid+'/save';
async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!user||!db)return;
    const uid=await user.id();if(!uid)return;
    CLOUD.db=db;CLOUD.uid=uid;CLOUD.state='cloud';
    const snap=await db.doc(savePath()).get();
    if(snap.exists){
      const d=snap.data(),g=JSON.parse(d.g);
      if(g&&g.p&&(!SAVED||(g.savedAt||0)>(SAVED.savedAt||0)))SAVED=g;
    }
  }catch(e){CLOUD.state=CLOUD.db?'cloud':'local'}
}
function cloudSave(){
  if(!CLOUD.db)return;
  CLOUD.pending=true;if(CLOUD.busy)return;CLOUD.busy=true;
  (async()=>{
    while(CLOUD.pending){
      CLOUD.pending=false;
      try{await CLOUD.db.doc(savePath()).set({g:JSON.stringify(G),ts:G.savedAt});CLOUD.ok=true}catch(e){CLOUD.ok=false}
      try{const nat=G.p.nat;await CLOUD.db.doc('leaderboard/'+CLOUD.uid).set({name:G.p.name,nat,rank:G.rank,day:G.day,score:G.score,xp:G.xp,ts:G.savedAt})}catch(e){}
    }
    CLOUD.busy=false;
  })();
}
function save(){G.savedAt=Date.now();SAVED=JSON.parse(JSON.stringify(G));try{localStorage.setItem(SAVE,JSON.stringify(G))}catch(e){}cloudSave()}
function advance(){G.pi++;go(ORDER[G.pi])}
function go(name){sceneName=name;scene=S[name];MU.setMood(name);scene.enter&&scene.enter()}

/* ---------- vẽ: cờ, người, nền ---------- */
function star(cx,cy,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.4:r;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad)}ctx.closePath();ctx.fill()}
function flag(x,y,w,h,id){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  const R=(c,a,b,cw,ch)=>{ctx.fillStyle=c;ctx.fillRect(x+a*w,y+b*h,cw*w,ch*h)};
  const D=(c,cx,cy,r)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+cx*w,y+cy*h,r*h,0,7);ctx.fill()};
  switch(id){
    case 'vn':R('#da251d',0,0,1,1);star(x+w/2,y+h/2,h*.32,'#ffcd00');break;
    case 'jp':R('#fff',0,0,1,1);D('#bc002d',.5,.5,.3);break;
    case 'us':for(let i=0;i<7;i++)R(i%2?'#fff':'#b22234',0,i/7,1,1/7);R('#3c3b6e',0,0,.45,4/7);break;
    case 'kr':R('#fff',0,0,1,1);D('#cd2e3a',.5,.5,.24);ctx.fillStyle='#0047a0';ctx.beginPath();ctx.arc(x+w/2,y+h/2,h*.24,0,Math.PI);ctx.fill();break;
    case 'fr':R('#0055a4',0,0,1/3,1);R('#fff',1/3,0,1/3,1);R('#ef4135',2/3,0,1/3,1);break;
    case 'br':R('#009c3b',0,0,1,1);ctx.fillStyle='#ffdf00';ctx.beginPath();ctx.moveTo(x+w/2,y+h*.12);ctx.lineTo(x+w*.9,y+h/2);ctx.lineTo(x+w/2,y+h*.88);ctx.lineTo(x+w*.1,y+h/2);ctx.fill();D('#002776',.5,.5,.22);break;
    case 'in':R('#ff9933',0,0,1,1/3);R('#fff',0,1/3,1,1/3);R('#138808',0,2/3,1,1/3);D('#000080',.5,.5,.12);break;
    case 'de':R('#000',0,0,1,1/3);R('#dd0000',0,1/3,1,1/3);R('#ffce00',0,2/3,1,1/3);break;
  }
  ctx.restore();ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
}
function person(x,y,p,sc=1,o={}){
  const nat=NAT.find(n=>n.id===p.nat),skin=SKIN[p.skin],hair=nat.hair,shirt=SHIRT[p.shirt];
  const step=o.walk?Math.sin(o.walk*12):0,bob=o.walk?Math.abs(step)*-2:0;
  ctx.save();ctx.translate(x,y);ctx.scale(sc*(o.flip?-1:1),sc);
  if(o.aura){const a=ctx.createRadialGradient(0,-20,4,0,-20,o.aura);a.addColorStop(0,shirt+'88');a.addColorStop(1,shirt+'00');ctx.fillStyle=a;ctx.beginPath();ctx.arc(0,-20,o.aura,0,7);ctx.fill()}
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,0,13,4,0,0,7);ctx.fill();
  if(o.walk)ctx.rotate(Math.sin(o.walk*12)*.045);else ctx.scale(1+Math.sin(T*2.4+x*.05)*.012,1+Math.sin(T*2.4+x*.05+1.2)*.022);
  const blinkNow=(T*.9+x*.013)%3.4<.14;
  ctx.fillStyle='#1c2833';ctx.fillRect(-7,-14+step*1.5,6,14-step*1.5);ctx.fillRect(1,-14-step*1.5,6,14+step*1.5);

function drawFx(dt){
  for(let i=PA.length-1;i>=0;i--){
    const p=PA[i];p.t+=dt;if(p.t>=p.life){PA.splice(i,1);continue}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    const k=p.t/p.life;ctx.globalAlpha=p.shape==='txt'||p.shape==='emo'?clamp(2-2*k,0,1):1-k*k;
    if(p.shape==='circ'){ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1+p.grow*k),0,7);ctx.fill()}
    else if(p.shape==='star'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);star(0,0,p.s*(1-k*.5),p.col);ctx.restore()}
    else if(p.shape==='rect'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.s,-p.s/2,p.s*2,p.s);ctx.restore()}
    else if(p.shape==='emo')emo(p.ch,p.x,p.y,p.s);
    else if(p.shape==='txt'){ctx.font='800 '+p.s+'px '+FONT;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(10,18,26,.9)';ctx.strokeText(p.ch,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.ch,p.x,p.y)}
    ctx.globalAlpha=1;
  }
}

const held=new Set();
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  held.add(e.code);
  MU.start();
  if(sceneName!=='setup'&&e.code==='KeyM'){muted=!muted;MU.apply();toast(muted?'Tắt toàn bộ âm thanh':'Bật âm thanh',C.dim);return}
  if(sceneName!=='setup'&&e.code==='KeyN'){MU.on=!MU.on;MU.apply();toast(MU.on?'Bật nhạc nền':'Tắt nhạc nền',C.dim);return}
  scene&&scene.key&&scene.key(e.code,e);
});
window.addEventListener('keyup',e=>held.delete(e.code));
window.addEventListener('blur',()=>held.clear());
const L=()=>held.has('ArrowLeft')||held.has('KeyA'),Rr=()=>held.has('ArrowRight')||held.has('KeyD'),U=()=>held.has('ArrowUp')||held.has('KeyW'),D=()=>held.has('ArrowDown')||held.has('KeyS');

function workScene(pm){
  const desks=[[120,150],[380,150],[640,150],[120,320],[380,320],[640,320]];
  const spots=[[70,126],[70,262],[70,430],[330,126],[330,262],[330,430],[590,126],[590,262],[590,430],[800,262],[800,430],[250,262],[520,262],[250,430],[520,430],[770,200]];
  let s;
  const hit=(px,py)=>desks.some(d=>px+9>d[0]&&px-9<d[0]+130&&py>d[1]&&py-8<d[1]+56);
  return{
    enter(){
      G.clock=pm?810:540;
      s={t:0,tl:45,px:60,py:262,walk:0,carry:0,flip:false,stun:0,docs:[],spawn:0,got:0,bumps:0,gain:0,done:false,paused:false,flash:0,rt:0,
         npcs:[{x:200,y:263,v:90,n:{nat:'us',female:true,skin:1,shirt:3}},{x:700,y:263,v:-110,n:{nat:'de',female:false,skin:0,shirt:2}},{x:400,y:426,v:100,n:{nat:'br',female:false,skin:3,shirt:4}}]};
      if(pm)s.npcs.forEach(n=>n.v*=1.25);
      for(let i=0;i<3;i++)this.spawn();
    },
    spawn(){
      const free=spots.filter(p=>!s.docs.some(d=>d.x===p[0]&&d.y===p[1])&&Math.hypot(p[0]-s.px,p[1]-s.py)>140);
      if(!free.length)return;const p=pick(free);s.docs.push({x:p[0],y:p[1],t:rand(0,6)});
    },
    update(dt){
      if(s.done){s.rt+=dt;return}
      if(s.paused)return;
      s.t+=dt;G.clock=(pm?810:540)+Math.min(s.t/s.tl,1)*(pm?120:150);
      s.stun=Math.max(0,s.stun-dt);s.flash=Math.max(0,s.flash-dt);
      let sp=170*(.75+.25*G.energy/100)*(has('kr')?1.1:1)*(G.p.age<=22?1.05:G.p.age>=40?.97:1);
      if(s.stun>0)sp*=.35;
      let dx=(Rr()?1:0)-(L()?1:0),dy=(D()?1:0)-(U()?1:0);
      if(dx&&dy){dx*=.7071;dy*=.7071}
      if(dx)s.flip=dx<0;
      const nx=clamp(s.px+dx*sp*dt,24,936);if(!hit(nx,s.py))s.px=nx;
      const ny=clamp(s.py+dy*sp*dt,118,478);if(!hit(s.px,ny))s.py=ny;
      s.walk=(dx||dy)?s.walk+dt:0;
      if(dx||dy){s.pf=(s.pf||0)-dt;if(s.pf<=0){fx.puff(s.px,s.py);s.pf=.13}if(s.carry&&Math.random()<dt*14)fx.spark(s.px+rand(-10,10),s.py-30,'#ffd166',1)}
      s.docs.forEach(d=>d.t+=dt);
      s.docs=s.docs.filter(d=>{if(s.carry<3&&Math.hypot(d.x-s.px,d.y-(s.py-14))<26){s.carry++;sfx.pick();fx.spark(d.x,d.y-8,'#ffd166',8);fx.text(d.x,d.y-24,'+1 tài liệu',C.txt);return false}return true});
      s.spawn-=dt;if(s.docs.length<3&&s.spawn<=0){this.spawn();s.spawn=1.1}
      if(s.carry>0&&s.px>830&&s.py<200){
        const n=s.carry,pts=n*10+(n-1)*8;s.carry=0;s.got+=n;G.ds.docs+=n;
        const v=Math.round(pts*(1+G.rank*.2));addScore(v);s.gain+=v;sfx.ok();toast('Đã giao '+n+' tài liệu  +'+v,C.green);fx.coins(880,150,6+n*3);fx.text(880,120,'+'+v,C.amber);fx.spark(s.px,s.py-40,C.green,12);
      }
      s.npcs.forEach(n=>{
        n.x+=n.v*dt;if(n.x>800){n.x=800;n.v=-Math.abs(n.v)}if(n.x<40){n.x=40;n.v=Math.abs(n.v)}
        if(s.stun<=0&&Math.abs(n.x-s.px)<20&&Math.abs(n.y-s.py)<12){
          s.stun=.9;s.bumps++;G.ds.bumps++;s.flash=.3;stat('mood',-2);sfx.bad();shake=9;fx.emo(s.px,s.py-62,'💫',3);fx.spark(s.px,s.py-30,'#ef476f',10);
          if(s.carry){toast('Rơi '+s.carry+' tài liệu!',C.coral);s.carry=0}else toast('Va chạm đồng nghiệp!',C.coral);
        }
      });
      if(s.t>=s.tl){
        s.done=true;G.ds.worked++;
        const xp=addXP(s.got*4+(s.bumps===0?10:0));stat('energy',-12);stat('mood',-2);s.xp=xp;
        if(s.got)G.streakDocs=(G.streakDocs||0)+s.got;
        sfx.win();fx.confetti(480,200,60);
      }
    },
    key(c){
      if(c==='KeyP'&&!s.done){s.paused=!s.paused;return}
      if(s.done&&s.rt>.7&&isOK(c))advance();
    },
    draw(){
      officeBG();
      // phòng sếp
      rect(830,96,100,70,'#4a3a2a');rect(836,102,88,58,'#2a1f16');rect(846,96,68,16,C.amber);text('SẾP',880,104,11,C.ink,'center',800);
      rr(842,126,76,30,4,'rgba(255,183,3,.25)',C.amber);text('GIAO',880,141,12,C.amber,'center',800);
      desks.forEach(d=>{
        rect(d[0],d[1],130,56,'#7a5a3b');rect(d[0],d[1]+44,130,12,'#5a4029');
        rect(d[0]+46,d[1]-22,38,26,'#1b2a38');rect(d[0]+49,d[1]-19,32,18,'#3da5d9');rect(d[0]+60,d[1]+4,10,6,'#1b2a38');
        rect(d[0]+8,d[1]+16,26,18,'#f5f5f0');rect(d[0]+96,d[1]+18,16,16,'#d6d0c4');
      });
      s.docs.forEach(d=>{const b=Math.sin(d.t*4)*3;rect(d.x-12,d.y-16+b,24,18,'#f8f8f2');rect(d.x-8,d.y-12+b,16,2,'#8fa6b8');rect(d.x-8,d.y-7+b,12,2,'#8fa6b8');ctx.strokeStyle=C.amber;ctx.lineWidth=2;ctx.strokeRect(d.x-13,d.y-17+b,26,20)});
      const ents=[{y:s.py,f:()=>{if(s.flash>0&&Math.floor(T*20)%2)ctx.globalAlpha=.4;person(s.px,s.py,G.p,1,{walk:s.walk,flip:s.flip,carry:s.carry,aura:22+s.carry*8+Math.sin(T*6)*2});ctx.globalAlpha=1}}];
      s.npcs.forEach(n=>ents.push({y:n.y,f:()=>person(n.x,n.y,n.n,1,{walk:T,flip:n.v<0})}));
      ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
      text('▼ bạn',s.px,s.py-72,10,C.amber,'center',800);
      // thanh thời gian
      rect(0,58,W,6,'#0a121a');rect(0,58,W*(1-s.t/s.tl),6,s.t>s.tl-10?C.coral:C.teal);
      text((pm?'Làm việc buổi chiều':'Làm việc buổi sáng')+'  ·  Đã giao '+s.got+'  ·  Mang '+s.carry+'/3  ·  '+Math.max(0,Math.ceil(s.tl-s.t))+'s',480,76,13,C.txt,'center',800);
      hud();strip('Mũi tên/WASD: di chuyển  ·  nhặt tài liệu rồi mang tới phòng Sếp  ·  P: tạm dừng');
      if(s.paused){rect(0,58,W,432,'rgba(10,18,26,.75)');text('TẠM DỪNG',480,260,36,C.txt,'center',800);text('Nhấn P để tiếp tục',480,300,14,C.dim,'center')}
      if(s.done){
        rect(0,58,W,432,'rgba(10,18,26,.8)');rr(280,150,400,230,12,C.panel,C.line);
        text('Hết giờ làm việc',480,190,26,C.txt,'center',800);
        text('Tài liệu đã giao: '+s.got,480,240,16,C.txt,'center',600);
        text('Điểm nhận được: +'+s.gain,480,270,16,C.amber,'center',800);
        text('Kinh nghiệm: +'+s.xp+' XP'+(s.bumps===0?'  (không va chạm +10)':''),480,300,14,C.teal,'center',600);
        text('Năng lượng -12',480,326,13,C.dim,'center');
        if(s.rt>.7&&blink(T))text('Nhấn Enter để tiếp tục',480,356,14,C.amber,'center',800);
      }
    }
  };
}

    if(s.st==='ready'){text('Gục xuống sofa một lát?',480,200,18,C.txt,'center',800);text('Thức dậy trong vùng xanh để hồi nhiều năng lượng nhất.',480,226,13,C.dim,'center')}
    if(s.st==='sleep')text(Math.floor(s.m)+' phút',480,200,34,C.txt,'center',800);
    if(s.st==='done'){
      rect(0,58,W,332,'rgba(10,18,26,.6)');rr(300,140,360,180,12,C.panel,C.line);
      text(s.res.perfect?'Dậy đúng lúc!':s.res.mood<0?(s.res.m>30?'Ngủ quá lâu, hơi uể oải':'Ngủ chưa đủ'):'Ngủ xong rồi',480,176,20,s.res.perfect?C.green:C.txt,'center',800);
      text('Đã ngủ '+s.res.m+' phút',480,208,14,C.dim,'center');
      text('Năng lượng +'+s.res.g+'   Tâm trạng '+(s.res.mood>=0?'+':'')+s.res.mood,480,238,15,C.teal,'center',800);
      if(s.res.perfect)text('+15 XP',480,264,13,C.amber,'center',800);
      if(blink(T))text('Enter để quay lại làm việc',480,296,14,C.amber,'center',800);
    }
  }
}})();

// --- Trà sữa buổi xế
S.tea=(()=>{let s;return{
  enter(){G.clock=960;s={row:0,tea:0,sugar:2,ice:2,top:0,tgt:{sugar:pick([1,2,3]),ice:pick([1,2,3]),top:pick([0,1,2])},res:null,t:0}},
  update(dt){s.t+=dt},
  key(c){
    if(s.res){if(isOK(c)&&s.t>.5)advance();return}
    if(isUp(c)){s.row=(s.row+3)%4;sfx.step()}
    if(isDn(c)){s.row=(s.row+1)%4;sfx.step()}
    const d=isR(c)?1:isL(c)?-1:0;
    if(d){const k=['tea','sugar','ice','top'][s.row],n=[TEAS.length,SUGAR.length,ICE.length,TOP.length][s.row];s[k]=(s[k]+d+n)%n;sfx.step()}
    if(c==='Escape'){stat('mood',-3);toast('Bạn bỏ qua trà sữa',C.dim);s.res={skip:true};s.t=0}
    if(isOK(c)){
      const price=TEAS[s.tea].p+(s.top<3?1:0);
      if(G.money<price){sfx.bad();toast('Không đủ xu! Nhấn Esc để bỏ qua',C.coral);return}
      G.money-=price;
      const m=[s.sugar===s.tgt.sugar,s.ice===s.tgt.ice,s.top===s.tgt.top],n=m.filter(Boolean).length;
      G.ds.tea=n;let mo=2+n*3;if(has('vn'))mo=Math.round(mo*1.5);
      stat('mood',mo);addXP(n*6);addScore(n*20+10);
      s.res={m,n,mo,price};s.t=0;if(n>=2){sfx.win();fx.confetti(700,300,50)}else sfx.ok();if(has('vn'))fx.emo(700,260,'💖',3);
    }
  },
  draw(){
    rect(0,0,W,H,'#3a2b33');windows(66,64,5);rect(0,138,W,8,'#0f1a24');
    rect(0,146,W,H-146,'#4a3a42');for(let y=146,j=0;y<H;y+=40,j++)for(let x=(j%2)*40;x<W;x+=80)rect(x,y,40,40,'#503f48');
    rect(0,300,W,24,'#8a6a55');rect(0,324,W,166,'#5a4350');
    hud();strip('↑↓ chọn mục  ·  ←→ thay đổi  ·  Enter: đặt hàng  ·  Esc: bỏ qua');
    text('Trà sữa buổi xế — đặt cho cả nhóm',48,90,22,C.txt,'left',800);
    rr(40,110,440,300,10,'rgba(19,33,45,.95)',C.line);
    const rows=[['Loại trà',TEAS[s.tea].n+'  ·  '+TEAS[s.tea].p+' xu'],['Đường',SUGAR[s.sugar]],['Đá',ICE[s.ice]],['Topping',TOP[s.top]]];
    rows.forEach((r,i)=>{const y=150+i*64,sel=i===s.row;rr(52,y-24,416,52,8,sel?'#1d3a50':'#0f1c27',sel?C.teal:null);
      text(r[0],70,y,12,C.dim,'left',800);text(r[1],360,y,16,C.txt,'center',800);if(sel){text('◀',250,y,14,C.amber,'center');text('▶',470,y,14,C.amber,'center')}});
    rr(40,424,440,52,10,'#0f1c27',C.amber);
    text('Nhóm nhắn: '+SUGAR[s.tgt.sugar]+' đường · '+ICE[s.tgt.ice].toLowerCase()+' · '+TOP[s.tgt.top].toLowerCase(),260,450,13,C.amber,'center',800);
    // cốc
    const cx=700,cy=380;
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(cx-60,cy-170);ctx.lineTo(cx+60,cy-170);ctx.lineTo(cx+44,cy);ctx.lineTo(cx-44,cy);ctx.fill();
    ctx.fillStyle=TEAS[s.tea].c;ctx.beginPath();ctx.moveTo(cx-56,cy-140);ctx.lineTo(cx+56,cy-140);ctx.lineTo(cx+44,cy);ctx.lineTo(cx-44,cy);ctx.fill();
    for(let i=0;i<s.ice*3;i++){const x=cx-34+(i*37)%68,y=cy-130+((i*23)%50);rr(x,y,16,16,3,'rgba(255,255,255,.55)')}
    if(s.top<3){const col=['#2a1a14','#f6e6a8','#e8c26a'][s.top];for(let i=0;i<10;i++){ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx-30+(i%5)*15,cy-8-Math.floor(i/5)*12,s.top===0?6:7,0,7);ctx.fill()}}
    rect(cx+10,cy-210,8,90,'#ef476f');rect(cx-62,cy-174,124,8,'#e8f0f6');
    person(560,448,G.p,1.6,{});
    if(s.res){
      rect(0,58,W,432,'rgba(10,18,26,.78)');rr(280,150,400,220,12,C.panel,C.line);
      if(s.res.skip){text('Không có trà sữa hôm nay',480,230,20,C.txt,'center',800);text('Tâm trạng -3',480,264,14,C.dim,'center')}
      else{
        text(s.res.n>=2?'Cả nhóm khen ngon!':s.res.n===1?'Cũng tạm được':'Nhóm hơi thất vọng',480,184,22,s.res.n>=2?C.green:C.txt,'center',800);
        ['Đường','Đá','Topping'].forEach((l,i)=>text((s.res.m[i]?'✓ ':'✗ ')+l,380+i*100,222,14,s.res.m[i]?C.green:C.coral,'center',800));
        text('Tâm trạng +'+s.res.mo+'   ·   Trả '+s.res.price+' xu',480,262,14,C.teal,'center',600);
        text('+'+(s.res.n*20+10)+' điểm  ·  +'+(s.res.n*6)+' XP',480,288,14,C.amber,'center',800);
      }
      if(blink(T))text('Enter để chuẩn bị tan làm',480,336,14,C.amber,'center',800);
    }
  }
}})();

// --- Tan làm và tổng kết
S.out=(()=>{let s;return{
  enter(){
    G.clock=1050;
    const lines=[];
    const sal=Math.round(RANKS[G.rank].sal*(has('us')?1.1:1));G.money+=sal;lines.push(['Lương ngày','+'+sal+' xu',C.amber]);
    let mx=0;G.missions.forEach(id=>{const m=missionObj(id),ok=m.ok(G.ds,G.rank);if(ok){let v=30+G.rank*10;if(has('de'))v=Math.round(v*1.2);mx+=addXP(v);addScore(100)}lines.push([(ok?'✓ ':'✗ ')+m.t(G.rank),ok?'+'+Math.round((30+G.rank*10)*(has('de')?1.2:1))+' XP':'—',ok?C.green:C.dim])});
    lines.push(['Chuỗi điểm danh',G.streak+' ngày',C.txt]);
    const old=G.rank;
    while(G.rank<RANKS.length-1&&G.xp>=RANKS[G.rank+1].xp)G.rank++;
    s={t:0,lines,promo:G.rank>old,old,px:200,gone:false,xpDay:G.dayXP,scDay:G.dayScore};
    if(s.promo){sfx.win();s.cf=0}
  },
  update(dt){s.t+=dt;if(s.promo&&s.t>.4&&s.t<5){s.cf-=dt;if(s.cf<=0){fx.confetti(rand(200,860),rand(90,160),18);s.cf=.35}}if(s.t>.6)s.px=Math.min(520,s.px+140*dt)},
  key(c){
    if(isOK(c)&&s.t>(s.lines.length*.35+1.2)){
      G.day++;stat('energy',G.p.age<=22?60:50);G.energy=clamp(G.energy,0,100);
      save();startDay();sfx.ok();go('brief');
    }
  },
  draw(){
    G.clock=1050;
    const t=clamp((s.t)/2,0,1);
    rect(0,0,W,H,mix('#18283a','#2a2036',t));rect(0,56,W,200,'#213548');
    for(let i=0;i<5;i++){rect(60+i*180,90,110,120,skyColor(1050));rect(114+i*180,90,2,120,'#0f1a24')}
    rect(0,256,W,H-256,'#2c3f52');
    if(s.px<515)person(s.px,360,G.p,2,{walk:s.t>.6?s.t:0,aura:s.promo?80:0});
    rect(500,300,34,110,'#3b536a');rect(506,306,22,30,C.green);
    hud();strip('Enter: sang ngày mới (tự động lưu)');
    rr(560,76,380,400,12,'rgba(19,33,45,.96)',C.line);
    text('Tan làm lúc 17:30',750,106,20,C.txt,'center',800);
    s.lines.forEach((l,i)=>{if(s.t>i*.35){const y=146+i*34;text(l[0],580,y,13,l[2]==C.dim?C.dim:C.txt,'left',600);text(l[1],920,y,13,l[2],'right',800)}});
    const k=s.lines.length*.35;
    if(s.t>k){
      const y=146+s.lines.length*34+12;
      rect(580,y-10,340,1,C.line);
      text('Hôm nay: +'+s.xpDay+' XP  ·  +'+s.scDay+' điểm',750,y+14,14,C.teal,'center',800);
      const nx=RANKS[G.rank+1];
      text(nx?'Cấp tiếp theo: '+nx.n+' ('+G.xp+'/'+nx.xp+' XP)':'Cấp cao nhất: Tổng giám đốc',750,y+40,12,C.dim,'center');
      if(s.promo){
        rr(584,y+58,332,56,10,C.amber);
        text('THĂNG CHỨC!',750,y+76,16,C.ink,'center',800);text(RANKS[s.old].n+' → '+RANKS[G.rank].n,750,y+98,13,C.ink,'center',800);
      }
      if(s.t>k+1.2&&blink(T))text('Nhấn Enter',750,452,14,C.amber,'center',800);
    }
  }
}})();


// --- Bảng xếp hạng
S.rank=(()=>{let rows,msg;return{
  enter(){
    rows=null;msg='Đang tải bảng xếp hạng...';
    if(!CLOUD.db){msg='Bảng xếp hạng chỉ có khi mở game qua link Claude và đã đăng nhập.';return}
    CLOUD.db.collection('leaderboard').orderBy('score','desc').limit(10).get()
      .then(q=>{rows=q.docs.map(d=>Object.assign({me:d.id===CLOUD.uid},d.data()));if(!rows.length)msg='Chưa có ai trên bảng. Hãy hoàn thành một ngày làm việc để lên bảng.'})
      .catch(()=>{msg='Không tải được bảng xếp hạng.'});
  },
  update(){},
  key(c){if(c==='Escape'||isOK(c)||c==='Space'){sfx.step();go('title')}},
  draw(){
    rect(0,0,W,H,C.ink);for(let x=0;x<W;x+=48)rect(x,0,1,H,'#14222e');
    text('Bảng xếp hạng Vạn Quốc',48,52,26,C.txt,'left',800);
    text('Top 10 theo tổng điểm. Điểm được cập nhật mỗi lần tan làm.',48,82,13,C.dim);
    rr(48,110,864,370,10,C.panel,C.line);
    if(!rows||!rows.length){text(msg,480,290,15,C.dim,'center',600)}
    else rows.forEach((r,i)=>{
      const y=146+i*34;
      if(r.me)rr(56,y-15,848,30,6,'#1d3a50',C.teal);
      text('#'+(i+1),80,y,15,i<3?C.amber:C.dim,'left',800);
      if(NAT.some(n=>n.id===r.nat))flag(130,y-9,26,18,r.nat);
      text(String(r.name||'Ẩn danh').slice(0,16)+(r.me?' (bạn)':''),170,y,14,C.txt,'left',800);
      text(RANKS[clamp(r.rank|0,0,6)].n,420,y,13,C.teal,'left',600);
      text('Ngày '+r.day,640,y,13,C.dim,'left',600);
      text(String(r.score),880,y,15,C.amber,'right',800);
    });
    text('Esc hoặc Enter: quay lại',W/2,516,12,C.dim,'center');
  }
}})();

/* ---------- vòng lặp ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
  ctx.clearRect(0,0,W,H);
  shake=Math.max(0,shake-dt*30);
  ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  if(scene){scene.update&&scene.update(dt);scene.draw()}
  drawFx(dt);
  ctx.restore();
  drawToasts(dt);
  requestAnimationFrame(loop);
}
go('title');
cloudInit();
requestAnimationFrame(loop);
})();
</script>
